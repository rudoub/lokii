name: Build macOS arm64 (iCloud Fix)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build Lokii arm64 DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: select modern Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_2*.app" | sort -V | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          fi
          if [ -z "$XCODE_PATH" ] && [ -d "/Applications/Xcode.app" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
            echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
          fi
          xcodebuild -version
          swift --version

      - name: setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: rust cache
        uses: Swatinem/rust-cache@v2

      - name: test lokii-core
        run: cargo test --manifest-path lokii-core/Cargo.toml

      - name: spm cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Lokii/.build/artifacts
            Lokii/.build/checkouts
            Lokii/.build/repositories
          key: ${{ runner.os }}-arm64-spm-${{ hashFiles('Lokii/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-arm64-spm-

      - name: resolve swift packages with retry
        run: |
          cd Lokii
          for i in 1 2 3 4 5; do
            if swift package resolve; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: install create-dmg
        run: brew install create-dmg || true

      - name: package app and dmg
        run: make package ARCH=arm64

      - name: upload dmg artifact
        uses: actions/upload-artifact@v5
        with:
          name: Lokii-arm64-icloud
          path: |
            output/Lokii-*.dmg
            output/Lokii-*.zip
          if-no-files-found: error
          overwrite: true
